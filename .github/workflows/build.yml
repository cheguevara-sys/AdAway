name: Build AdAway APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # Enables the "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required for Android Gradle plugin 7+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up the Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android NDK (required for native code)
      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-ndk
          echo "ANDROID_NDK_HOME=/usr/lib/android-sdk/ndk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/ndk" >> $GITHUB_PATH

      # 5. Make the Gradle wrapper executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6. Build the debug APK (no signing required)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 7. Upload the APK as an artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-Debug
          path: app/build/outputs/apk/debug/*.apk

      # 8. Build the release APK (unsigned, but works)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 9. Upload the release APK as an artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-Release
          path: app/build/outputs/apk/release/*.apk
